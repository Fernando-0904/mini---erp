<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini ERP - Redefinir senha</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/login.css?v=4">
    <link rel="stylesheet" href="css/responsive.css?v=1">
</head>
<body data-auth-page="redefinir-senha">
<main class="auth-token-page">
    <section class="auth-token-card">
        <p class="acesso-restrito-marcador">Recuperação de acesso</p>
        <h1>Redefinir senha</h1>
        <p id="mensagemAuthToken" class="auth-token-mensagem auth-token-info" aria-live="polite">Informe sua nova senha.</p>
        <form id="formRedefinirSenha" class="form-login-visual" novalidate>
            <label for="novaSenha">Nova senha</label>
            <input type="password" id="novaSenha" autocomplete="new-password" minlength="8" maxlength="128" required>
            <label for="confirmarNovaSenha">Confirmar nova senha</label>
            <input type="password" id="confirmarNovaSenha" autocomplete="new-password" minlength="8" maxlength="128" required>
            <button type="submit">Redefinir senha</button>
        </form>
        <a href="index.html" class="auth-token-link">Voltar para o Mini ERP</a>
    </section>
</main>
<script src="js/api.js?v=9"></script>
<script src="js/auth-token-controller.js?v=1"></script>
</body>
</html>
